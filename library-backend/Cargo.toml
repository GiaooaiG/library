[package]
name = "library-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0"
diesel = { version = "2.0", features = ["mysql", "chrono", "r2d2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
r2d2 = "0.8"
validator = { version = "0.16", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
env_logger = "0.10"
argon2 = "0.5"
jsonwebtoken = "9.0"
rand_core = "0.6"
rand = "0.8"
futures = "0.3.31"
